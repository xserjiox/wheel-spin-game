<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Крути — колесо случайного выбора</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Крути — на главную">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>КРУТИ</span>
        </a>
        <p class="tagline">Честный выбор без лишних раздумий</p>
      </header>

      <section class="workspace">
        <section class="wheel-section" aria-labelledby="wheel-title">
          <div class="section-heading">
            <p class="eyebrow">КОЛЕСО ФОРТУНЫ</p>
            <h1 id="wheel-title">Кому повезёт?</h1>
            <p>Добавьте варианты, выберите время и запускайте.</p>
          </div>

          <div class="wheel-stage">
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel-wrap" id="wheelWrap">
              <canvas id="wheel" aria-label="Колесо с вариантами выбора"></canvas>
            </div>
            <button class="spin-center" id="spinCenter" type="button" aria-label="Запустить вращение">
              <span>КРУТИ</span>
            </button>
          </div>

          <div class="spin-status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">Готово к запуску</span>
          </div>
        </section>

        <aside class="control-panel" aria-label="Настройки колеса">
          <section class="panel-section title-section">
            <label class="custom-time-label" for="titleInput">Название колеса</label>
            <input id="titleInput" class="title-input" type="text" maxlength="60" autocomplete="off" placeholder="Кому повезёт?" />
          </section>

          <div class="panel-divider title-divider"></div>

          <section class="panel-section">
            <div class="panel-title-row">
              <div>
                <p class="step-label">ШАГ 01</p>
                <h2>Варианты</h2>
              </div>
              <span class="count-badge" id="countBadge">0</span>
            </div>

            <form class="add-form" id="addForm">
              <label class="sr-only" for="optionInput">Новый вариант</label>
              <input id="optionInput" type="text" maxlength="80" autocomplete="off" placeholder="Например, Пицца" />
              <button class="add-button" type="submit" aria-label="Добавить вариант">+</button>
            </form>

            <div class="options-list" id="optionsList"></div>
            <p class="probability" id="probabilityText">Добавьте хотя бы 2 варианта</p>
          </section>

          <div class="panel-divider"></div>

          <section class="panel-section">
            <div class="panel-title-row">
              <div>
                <p class="step-label">ШАГ 02</p>
                <h2>Время вращения</h2>
              </div>
            </div>

            <div class="time-presets" role="group" aria-label="Готовые значения времени">
              <button class="time-chip" type="button" data-time="10">10 сек</button>
              <button class="time-chip active" type="button" data-time="20">20 сек</button>
              <button class="time-chip" type="button" data-time="30">30 сек</button>
            </div>

            <label class="custom-time-label" for="customTime">Своё время</label>
            <div class="custom-time">
              <input id="customTime" type="number" min="1" max="300" step="1" value="20" inputmode="numeric" />
              <span>секунд</span>
            </div>
          </section>

          <button class="primary-button" id="spinButton" type="button">
            <span>Запустить колесо</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
        </aside>
      </section>
    </main>

    <div class="result-modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="result-card">
        <button class="modal-close" type="button" data-close-modal aria-label="Закрыть">×</button>
        <p class="eyebrow">КОЛЕСО ВЫБРАЛО</p>
        <div class="result-spark" aria-hidden="true">✦</div>
        <h2 id="resultTitle">Победитель</h2>
        <p class="result-name" id="resultName"></p>
        <button class="secondary-button" id="spinAgain" type="button">Крутить ещё раз</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
