services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wheel-spin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wheel-spin-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - wheel-spin-redis:/data

volumes:
  wheel-spin-postgres:
  wheel-spin-redis:
